<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal Fotográfico | Remember Photobooths</title>
  
  <meta property="og:title" content="Tus fotos están listas | Remember Photobooths">
  <meta property="og:description" content="Descarga tu paquete de fotos oficiales del evento.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    body {
      background: #07090e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Luces Dinámicas Neón */
    @keyframes pulseGlowTop {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.18) translate(30px, 20px); opacity: 1; }
    }
    @keyframes pulseGlowBottom {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.22) translate(-30px, -20px); opacity: 0.95; }
    }
    .glow-top {
      position: fixed; width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.35) 0%, rgba(139,92,246,0.18) 45%, transparent 70%);
      top: -140px; left: -140px; filter: blur(65px); pointer-events: none;
      animation: pulseGlowTop 10s ease-in-out infinite;
    }
    .glow-bottom {
      position: fixed; width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, rgba(59,130,246,0.15) 45%, transparent 70%);
      bottom: -140px; right: -140px; filter: blur(65px); pointer-events: none;
      animation: pulseGlowBottom 12s ease-in-out infinite;
    }

    .modal-container {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 30px 20px;
      max-width: 410px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.75);
      position: relative;
      z-index: 2;
    }
    .btn-close {
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      color: #94a3b8; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.85rem; cursor: not-allowed; transition: 0.25s;
    }
    .btn-close.unlocked {
      background: #ef4444; border-color: #f87171; color: #fff; cursor: pointer;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
    }

    /* Avatar Adaptativo para PNGs */
    .avatar-wrapper {
      width: 125px; height: 125px; border-radius: 28px; margin: 0 auto 18px; padding: 5px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4); box-shadow: 0 0 30px rgba(236,72,153,0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-inner {
      width: 100%; height: 100%; border-radius: 23px; background: #000;
      display: flex; align-items: center; justify-content: center; padding: 12px; overflow: hidden;
    }
    .avatar-image { max-width: 100%; max-height: 100%; object-fit: contain; }

    h1 {
      font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; line-height: 1.3;
      background: linear-gradient(135deg, #fff 50%, #cbd5e1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p.subtitle-text { font-size: 0.88rem; color: #94a3b8; line-height: 1.45; margin-bottom: 22px; }

    .social-btn-stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .action-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px; border-radius: 16px; font-weight: 800; font-size: 0.95rem; text-decoration: none;
      color: #fff; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; border: none; width: 100%;
    }
    .action-btn:active { transform: scale(0.97); }
    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      box-shadow: 0 6px 20px rgba(220,39,67,0.4);
    }
    .btn-tiktok {
      background: #000; border: 1px solid #334155; box-shadow: 0 6px 20px rgba(0,242,234,0.2);
    }
    .btn-whatsapp {
      background: #25d366; color: #052410; box-shadow: 0 6px 20px rgba(37,211,102,0.35);
    }

    .progress-bar-bg {
      width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-bottom: 14px;
    }
    .progress-bar-inner {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ec4899, #06b6d4); transition: width 1s linear;
    }

    .btn-download-photos {
      width: 100%; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #64748b; font-size: 0.95rem; font-weight: 800;
      cursor: not-allowed; transition: 0.25s;
    }
    .btn-download-photos.unlocked {
      background: linear-gradient(135deg, #3b82f6, #6366f1); border-color: #60a5fa; color: #fff;
      cursor: pointer; box-shadow: 0 8px 25px rgba(59,130,246,0.45);
    }

    .brand-signature {
      margin-top: 24px; font-size: 0.75rem; color: #64748b; z-index: 2;
    }
    .brand-signature a { color: #f472b6; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="modal-container">
    <button id="closeButton" class="btn-close" aria-label="Cerrar">5s</button>

    <div class="avatar-wrapper">
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" src="" alt="Logo">
      </div>
    </div>

    <h1>¡Tus fotos en alta calidad están listas! 📸</h1>
    <p class="subtitle-text">Síguenos para revivir los mejores momentos del evento y etiquetarte en tus fotos.</p>

    <div id="socialButtonsContainer" class="social-btn-stack"></div>

    <div class="progress-bar-bg">
      <div id="progressBarFill" class="progress-bar-inner"></div>
    </div>

    <button id="downloadButton" class="btn-download-photos">
      Preparando fotos (<span id="secondsLeftDisplay">5</span>s)...
    </button>
  </div>

  <div class="brand-signature">
    Impulsado con calidad por <a href="https://www.instagram.com/rememberph.co/" target="_blank">Remember Photobooths</a> ✨
  </div>

  <script>
    // Logo SVG por defecto idéntico al oficial Remember Photobooths
    const DEFAULT_REMEMBER_LOGO = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
        <rect width="100%" height="100%" fill="#000000" rx="30"/>
        <text x="50%" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial Black, sans-serif" font-weight="900" font-size="70" fill="#ffffff" letter-spacing="-2">Remember</text>
        <text x="50%" y="285" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="500" font-size="20" fill="#ffffff" letter-spacing="12">PHOTOBOOTHS</text>
      </svg>
    `);

    const urlParams = new URLSearchParams(window.location.search);
    
    // Decodificación de URL compacta base64 o estándar
    function desempaquetarUrl() {
      const b64 = urlParams.get('b');
      if (b64) {
        try {
          const padded = b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4);
          return decodeURIComponent(escape(atob(padded)));
        } catch (e) {
          console.warn('Error b64', e);
        }
      }
      return urlParams.get('f') || 'https://www.instagram.com/rememberph.co/';
    }

    const destinationUrl = desempaquetarUrl();
    const waitTime = parseInt(urlParams.get('t')) || 5;
    const logoUrl = urlParams.get('l') || localStorage.getItem('rp_custom_logo') || DEFAULT_REMEMBER_LOGO;

    document.getElementById('avatarImage').src = logoUrl;

    const igHandle = urlParams.get('ig');
    const ttHandle = urlParams.get('tt');
    const waNumber = urlParams.get('wa');

    // Función de Deep Linking Ambivalente (App nativa en celular + Fallback Web)
    function abrirRedAmbivalente(appScheme, webUrl) {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // Intenta abrir la aplicación instalada
        window.location.href = appScheme;
        // Si después de 600ms la app no abrió, redirige al navegador web
        setTimeout(() => {
          window.open(webUrl, '_blank');
        }, 600);
      } else {
        // En computador de escritorio va directo a la web en pestaña nueva
        window.open(webUrl, '_blank');
      }
    }

    const socialContainer = document.getElementById('socialButtonsContainer');

    if (igHandle) {
      const clean = igHandle.replace('@', '');
      const btn = document.createElement('button');
      btn.className = 'action-btn btn-instagram';
      btn.innerHTML = `<i class="fa-brands fa-instagram"></i> Seguir en Instagram`;
      btn.onclick = () => abrirRedAmbivalente(`instagram://user?username=${clean}`, `https://instagram.com/${clean}`);
      socialContainer.appendChild(btn);
    }

    if (ttHandle) {
      const clean = ttHandle.replace('@', '');
      const btn = document.createElement('button');
      btn.className = 'action-btn btn-tiktok';
      btn.innerHTML = `<i class="fa-brands fa-tiktok"></i> Seguir en TikTok`;
      btn.onclick = () => abrirRedAmbivalente(`snssdk1128://user/profile/${clean}`, `https://tiktok.com/@${clean}`);
      socialContainer.appendChild(btn);
    }

    if (waNumber) {
      const clean = waNumber.replace(/\D/g, '');
      const btn = document.createElement('button');
      btn.className = 'action-btn btn-whatsapp';
      btn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> Chatear en WhatsApp`;
      btn.onclick = () => abrirRedAmbivalente(`whatsapp://send?phone=${clean}`, `https://wa.me/${clean}`);
      socialContainer.appendChild(btn);
    }

    if (!igHandle && !ttHandle && !waNumber) {
      const btn = document.createElement('button');
      btn.className = 'action-btn btn-instagram';
      btn.innerHTML = `<i class="fa-brands fa-instagram"></i> Seguir en Instagram`;
      btn.onclick = () => abrirRedAmbivalente('instagram://user?username=rememberph.co', 'https://www.instagram.com/rememberph.co/');
      socialContainer.appendChild(btn);
    }

    let secondsRemaining = waitTime;
    const closeBtn = document.getElementById('closeButton');
    const downloadBtn = document.getElementById('downloadButton');
    const secondsDisplay = document.getElementById('secondsLeftDisplay');
    const progressBar = document.getElementById('progressBarFill');

    function redirigirAFotos() {
      window.location.href = destinationUrl;
    }

    closeBtn.textContent = `${secondsRemaining}s`;
    secondsDisplay.textContent = secondsRemaining;

    const intervalTimer = setInterval(() => {
      secondsRemaining--;
      progressBar.style.width = ((waitTime - secondsRemaining) / waitTime * 100) + '%';

      if (secondsRemaining > 0) {
        closeBtn.textContent = `${secondsRemaining}s`;
        secondsDisplay.textContent = secondsRemaining;
      } else {
        clearInterval(intervalTimer);
        closeBtn.textContent = '✕';
        closeBtn.classList.add('unlocked');
        closeBtn.onclick = redirigirAFotos;

        downloadBtn.textContent = 'Ver mis fotos →';
        downloadBtn.classList.add('unlocked');
        downloadBtn.onclick = redirigirAFotos;
      }
    }, 1000);
  </script>
</body>
</html>
