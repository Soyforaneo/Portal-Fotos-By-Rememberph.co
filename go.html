<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus fotos están listas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #07090e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .glow-1 {
      position: fixed; width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, transparent 70%);
      top: -100px; left: -100px; filter: blur(50px); pointer-events: none;
    }
    .glow-2 {
      position: fixed; width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.25) 0%, transparent 70%);
      bottom: -100px; right: -100px; filter: blur(50px); pointer-events: none;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 34px 22px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.7);
      position: relative;
      z-index: 1;
    }
    .close-btn {
      position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      color: #94a3b8; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; cursor: not-allowed; transition: 0.25s;
    }
    .close-btn.unlocked {
      background: #ef4444; border-color: #f87171; color: #fff; cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    .avatar-wrap {
      width: 95px; height: 95px; border-radius: 24px; margin: 0 auto 18px; padding: 3px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4); box-shadow: 0 0 25px rgba(236,72,153,0.45);
    }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 21px; }
    h1 {
      font-size: 1.45rem; font-weight: 800; margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 50%, #cbd5e1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p.sub { font-size: 0.9rem; color: #94a3b8; line-height: 1.4; margin-bottom: 22px; }
    
    .btn-ig {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      box-shadow: 0 6px 20px rgba(220,39,67,0.4); color: white; text-decoration: none;
      padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; margin-bottom: 12px;
    }
    .btn-tt {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #000; border: 1px solid #334155; box-shadow: 0 6px 20px rgba(0,242,234,0.2);
      color: white; text-decoration: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; margin-bottom: 18px;
    }

    .bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ec4899, #06b6d4); transition: width 1s linear; }

    .btn-photos {
      width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: #64748b; font-size: 0.95rem; font-weight: 700;
      cursor: not-allowed; transition: 0.25s;
    }
    .btn-photos.unlocked {
      background: linear-gradient(135deg, #3b82f6, #6366f1); border-color: #60a5fa; color: #fff;
      cursor: pointer; box-shadow: 0 8px 25px rgba(59,130,246,0.4);
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <button id="closeBtn" class="close-btn">5s</button>

    <div id="avatarWrap" class="avatar-wrap" style="display: none;">
      <img id="avatarImg" class="avatar-img" src="" alt="Logo">
    </div>

    <h1 id="titleDisplay">¡Tus fotos en alta calidad están listas! 📸</h1>
    <p class="sub">Síguenos para revivir los mejores momentos del evento y etiquetarte en tus fotos.</p>

    <a id="igLink" href="#" target="_blank" class="btn-ig">
      <i class="fa-brands fa-instagram"></i> Seguir en Instagram
    </a>

    <a id="ttLink" href="#" target="_blank" class="btn-tt" style="display: none;">
      <i class="fa-brands fa-tiktok"></i> Seguir en TikTok
    </a>

    <div class="bar-bg">
      <div id="barFill" class="bar-fill"></div>
    </div>

    <button id="photosBtn" class="btn-photos">Preparando fotos (5s)...</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('f') || 'https://instagram.com';
    const igUser = params.get('ig') || 'rememberph';
    const ttUser = params.get('tt');
    const logoUrl = params.get('l');

    document.getElementById('igLink').href = `https://instagram.com/${igUser}`;

    if (ttUser) {
      const tt = document.getElementById('ttLink');
      tt.href = `https://tiktok.com/@${ttUser}`;
      tt.style.display = 'flex';
    }

    if (logoUrl) {
      document.getElementById('avatarImg').src = logoUrl;
      document.getElementById('avatarWrap').style.display = 'block';
    }

    let timeLeft = 5;
    const closeBtn = document.getElementById('closeBtn');
    const photosBtn = document.getElementById('photosBtn');
    const barFill = document.getElementById('barFill');

    function irAFotos() {
      window.location.href = targetUrl;
    }

    const timer = setInterval(() => {
      timeLeft--;
      barFill.style.width = ((5 - timeLeft) / 5 * 100) + '%';

      if (timeLeft > 0) {
        closeBtn.textContent = timeLeft + 's';
        photosBtn.textContent = `Preparando fotos (${timeLeft}s)...`;
      } else {
        clearInterval(timer);
        closeBtn.textContent = '✕';
        closeBtn.classList.add('unlocked');
        closeBtn.onclick = irAFotos;

        photosBtn.textContent = 'Ver mis fotos →';
        photosBtn.classList.add('unlocked');
        photosBtn.onclick = irAFotos;
      }
    }, 1000);
  </script>
</body>
</html>
