<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Enlaces - Portal de Fotos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }
    .panel {
      background: rgba(18, 24, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 25px;
      flex: 1;
      min-width: 320px;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #8b5cf6;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    .quick-templates {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover {
      background: #334155;
      color: #fff;
    }
    .output-box {
      background: #090d16;
      border: 1px dashed #334155;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
    }
    .output-url {
      font-size: 0.8rem;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 12px;
      font-family: monospace;
      max-height: 70px;
      overflow-y: auto;
    }
    .btn-copy {
      width: 100%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-copy:hover {
      opacity: 0.9;
    }
    .phone-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 320px;
      max-width: 400px;
    }
    .phone-mockup {
      width: 100%;
      height: 640px;
      background: #000;
      border: 10px solid #1e293b;
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }
    .phone-notch {
      width: 120px;
      height: 18px;
      background: #1e293b;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      margin: 0 auto;
      z-index: 10;
    }
    .phone-screen {
      flex: 1;
      background: #090d16;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .sim-card {
      background: rgba(18, 24, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px 15px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .sim-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .sim-logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
      padding: 2px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
    }
    .sim-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .sim-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .sim-socials {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }
    .sim-btn {
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .sim-btn-ig { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .sim-btn-tt { background: #000; border: 1px solid #334155; }
    .sim-btn-wa { background: #25d366; color: #072b14; }
    .sim-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .sim-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #ec4899, #06b6d4);
    }
    .sim-btn-fotos {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #64748b;
      font-size: 0.8rem;
      font-weight: 700;
    }
    #qrContainer {
      display: flex;
      justify-content: center;
      margin: 15px 0;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Panel Generador de Enlaces</h1>
    <p>Crea el link puente con tus redes para el código QR de cada cliente</p>
  </div>

  <div class="container">
    
    <!-- PANEL DE CONFIGURACIÓN -->
    <div class="panel">
      <div class="form-group">
        <label>1. Enlace de las fotos (Drive, Dropbox, etc.)</label>
        <input type="url" id="inputTarget" placeholder="https://drive.google.com/..." value="https://drive.google.com/">
      </div>

      <div class="form-group">
        <label>2. Tus Redes Sociales</label>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <input type="text" id="inputIg" placeholder="Instagram (ej: tu_marca)" value="tu_marca">
          <input type="text" id="inputTt" placeholder="TikTok (opcional, ej: tu_marca)">
          <input type="text" id="inputWa" placeholder="WhatsApp (opcional, ej: 573001234567)">
        </div>
      </div>

      <div class="form-group">
        <label>3. Logo o Foto de Marca (URL opcional)</label>
        <input type="url" id="inputLogo" placeholder="https://i.imgur.com/tu-foto.jpg">
      </div>

      <div class="form-group">
        <label>4. Título Principal</label>
        <input type="text" id="inputTitle" value="¡Tus fotos están listas! ✨">
      </div>

      <div class="form-group">
        <label>5. Subtítulo / Mensaje</label>
        <textarea id="inputSubtitle">¡Gracias por celebrar con nosotros! Síguenos para ver los mejores momentos del evento.</textarea>
        <div class="quick-templates">
          <button type="button" class="pill" onclick="setSub('¡Gracias por celebrar con nosotros! Síguenos para no perderte ningún recuerdo.')">Fiesta / Evento</button>
          <button type="button" class="pill" onclick="setSub('Un recuerdo inolvidable. Síguenos y comparte tu experiencia con nosotros.')">Boda / Especial</button>
          <button type="button" class="pill" onclick="setSub('Tus retratos profesionales están listos para descargar en alta calidad.')">Retrato</button>
        </div>
      </div>

      <!-- LINK RESULTANTE Y QR -->
      <div class="output-box">
        <label style="color: #38bdf8;">Enlace final para tu Código QR:</label>
        <div id="outputUrl" class="output-url"></div>
        <button type="button" class="btn-copy" onclick="copiarLink()">
          <i class="fa-regular fa-copy"></i> Copiar Enlace
        </button>
        <div id="qrContainer"></div>
      </div>
    </div>

    <!-- VISTA PREVIA DEL CELULAR -->
    <div class="phone-container">
      <div class="phone-mockup">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="sim-card">
            <div class="sim-close">5s</div>
            <img id="simLogoImg" class="sim-logo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" style="display: none;">
            <div id="simTitle" class="sim-title">¡Tus fotos están listas! ✨</div>
            <div id="simSub" class="sim-sub">¡Gracias por celebrar con nosotros! Síguenos para ver los mejores momentos del evento.</div>
            
            <div class="sim-socials" id="simSocials"></div>

            <div class="sim-bar">
              <div class="sim-bar-fill"></div>
            </div>

            <button class="sim-btn-fotos">Preparando fotos (5s)...</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let qrInstance = null;

    function setSub(text) {
      document.getElementById('inputSubtitle').value = text;
      actualizar();
    }

    function actualizar() {
      const target = document.getElementById('inputTarget').value.trim();
      const ig = document.getElementById('inputIg').value.trim();
      const tt = document.getElementById('inputTt').value.trim();
      const wa = document.getElementById('inputWa').value.trim();
      const logo = document.getElementById('inputLogo').value.trim();
      const title = document.getElementById('inputTitle').value.trim();
      const subtitle = document.getElementById('inputSubtitle').value.trim();

      // Construcción de la URL real
      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '') + 'go.html';
      const params = new URLSearchParams();

      if (target) params.set('destino', target);
      if (ig) params.set('ig', ig);
      if (tt) params.set('tiktok', tt);
      if (wa) params.set('wa', wa);
      if (logo) params.set('logo', logo);
      if (title) params.set('titulo', encodeURIComponent(title));
      if (subtitle) params.set('subtitulo', encodeURIComponent(subtitle));

      const finalUrl = baseUrl + '?' + params.toString();
      document.getElementById('outputUrl').textContent = finalUrl;

      // Actualizar Código QR
      const qrDiv = document.getElementById('qrContainer');
      qrDiv.innerHTML = '';
      qrInstance = new QRCode(qrDiv, {
        text: finalUrl,
        width: 120,
        height: 120,
        colorDark: "#000000",
        colorLight: "#ffffff"
      });

      // Actualizar Vista Celular
      document.getElementById('simTitle').textContent = title || '¡Tus fotos están listas!';
      document.getElementById('simSub').textContent = subtitle;

      const simLogo = document.getElementById('simLogoImg');
      if (logo) {
        simLogo.src = logo;
        simLogo.style.display = 'inline-block';
      } else {
        simLogo.style.display = 'none';
      }

      const simSocials = document.getElementById('simSocials');
      simSocials.innerHTML = '';

      if (ig) {
        simSocials.innerHTML += `<div class="sim-btn sim-btn-ig"><i class="fa-brands fa-instagram"></i> Seguir en Instagram</div>`;
      }
      if (tt) {
        simSocials.innerHTML += `<div class="sim-btn sim-btn-tt"><i class="fa-brands fa-tiktok"></i> Seguir en TikTok</div>`;
      }
      if (wa) {
        simSocials.innerHTML += `<div class="sim-btn sim-btn-wa"><i class="fa-brands fa-whatsapp"></i> Chatear en WhatsApp</div>`;
      }
      if (!ig && !tt && !wa) {
        simSocials.innerHTML += `<div class="sim-btn sim-btn-ig"><i class="fa-brands fa-instagram"></i> Seguir en Instagram</div>`;
      }
    }

    function copiarLink() {
      const url = document.getElementById('outputUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.btn-copy');
        const oldHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!';
        setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
      });
    }

    // Escuchar cambios en los campos de texto
    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', actualizar);
    });

    window.onload = actualizar;
  </script>
</body>
</html>
