<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus fotos están listas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090d16;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .glow-1 {
      position: absolute; width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(236,72,153,0.35) 0%, transparent 70%);
      top: -80px; left: -80px; filter: blur(40px); z-index: 0;
    }
    .glow-2 {
      position: absolute; width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, transparent 70%);
      bottom: -80px; right: -80px; filter: blur(40px); z-index: 0;
    }
    .card {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      position: relative;
      z-index: 1;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: not-allowed;
      transition: all 0.25s ease;
    }
    .close-btn.unlocked {
      background: #ef4444;
      border-color: #f87171;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    .logo-container {
      margin: 0 auto 18px;
      display: inline-block;
    }
    .logo-img {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      object-fit: cover;
      padding: 3px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
      box-shadow: 0 0 20px rgba(236,72,153,0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 40%, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 24px;
    }
    .social-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 18px;
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .social-btn:active { transform: scale(0.97); }
    .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); box-shadow: 0 4px 16px rgba(220,39,67,0.35); }
    .btn-tiktok { background: #000; border: 1px solid #222; box-shadow: 0 4px 16px rgba(0,242,234,0.25); }
    .btn-wa { background: #25d366; color: #072b14; box-shadow: 0 4px 16px rgba(37,211,102,0.35); }
    .btn-fb { background: #1877f2; box-shadow: 0 4px 16px rgba(24,119,242,0.35); }
    .btn-yt { background: #ff0000; box-shadow: 0 4px 16px rgba(255,0,0,0.35); }
    .btn-def { background: linear-gradient(135deg, #6366f1, #8b5cf6); }

    .progress-bar-wrap {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #06b6d4);
      transition: width 1s linear;
    }

    .btn-continue {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #64748b;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: not-allowed;
      transition: all 0.25s ease;
    }
    .btn-continue.unlocked {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-color: #60a5fa;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(59,130,246,0.4);
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <button id="closeBtn" class="close-btn" aria-label="Cerrar">5s</button>

    <div id="logoWrapper" class="logo-container" style="display: none;">
      <img id="logoImg" class="logo-img" src="" alt="Logo">
    </div>

    <h1 id="mainTitle">¡Tus fotos están listas! ✨</h1>
    <p id="mainSubtitle" class="subtitle">Síguenos para estar al día de los mejores momentos y enterarte de las novedades.</p>

    <div id="socialList" class="social-list"></div>

    <div class="progress-bar-wrap">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <button id="continueBtn" class="btn-continue">
      Preparando fotos (<span id="secCount">5</span>s)...
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('destino') || 'https://instagram.com';
    const logoUrl = params.get('logo');
    const title = params.get('titulo');
    const subtitle = params.get('subtitulo');
    const igUser = params.get('ig');
    const ttUser = params.get('tiktok');
    const waNum = params.get('wa');

    if (logoUrl) {
      document.getElementById('logoImg').src = logoUrl;
      document.getElementById('logoWrapper').style.display = 'inline-block';
    }
    if (title) document.getElementById('mainTitle').textContent = decodeURIComponent(title);
    if (subtitle) document.getElementById('mainSubtitle').textContent = decodeURIComponent(subtitle);

    const socialList = document.getElementById('socialList');

    if (igUser) {
      const clean = igUser.replace('@', '').trim();
      const a = document.createElement('a');
      a.className = 'social-btn btn-ig';
      a.target = '_blank';
      a.href = `https://instagram.com/${clean}`;
      a.innerHTML = `<i class="fa-brands fa-instagram"></i> Seguir en Instagram`;
      socialList.appendChild(a);
    }

    if (ttUser) {
      const clean = ttUser.replace('@', '').trim();
      const a = document.createElement('a');
      a.className = 'social-btn btn-tiktok';
      a.target = '_blank';
      a.href = `https://tiktok.com/@${clean}`;
      a.innerHTML = `<i class="fa-brands fa-tiktok"></i> Seguir en TikTok`;
      socialList.appendChild(a);
    }

    if (waNum) {
      const clean = waNum.replace(/\D/g, '');
      const a = document.createElement('a');
      a.className = 'social-btn btn-wa';
      a.target = '_blank';
      a.href = `https://wa.me/${clean}`;
      a.innerHTML = `<i class="fa-brands fa-whatsapp"></i> Chatear en WhatsApp`;
      socialList.appendChild(a);
    }

    // Si no se pasó ninguna red social, dejamos por defecto Instagram
    if (!igUser && !ttUser && !waNum) {
      const a = document.createElement('a');
      a.className = 'social-btn btn-ig';
      a.target = '_blank';
      a.href = `https://instagram.com`;
      a.innerHTML = `<i class="fa-brands fa-instagram"></i> Seguir en Instagram`;
      socialList.appendChild(a);
    }

    // Cuenta regresiva de 5 segundos
    let seconds = 5;
    const closeBtn = document.getElementById('closeBtn');
    const continueBtn = document.getElementById('continueBtn');
    const secCount = document.getElementById('secCount');
    const progressFill = document.getElementById('progressFill');

    function redirigir() {
      window.location.href = targetUrl;
    }

    const interval = setInterval(() => {
      seconds--;
      const percent = ((5 - seconds) / 5) * 100;
      progressFill.style.width = percent + '%';

      if (seconds > 0) {
        closeBtn.textContent = seconds + 's';
        secCount.textContent = seconds;
      } else {
        clearInterval(interval);
        // Habilitar la X
        closeBtn.textContent = '✕';
        closeBtn.classList.add('unlocked');
        closeBtn.onclick = redirigir;

        // Habilitar botón inferior
        continueBtn.classList.add('unlocked');
        continueBtn.textContent = 'Ver mis fotos →';
        continueBtn.onclick = redirigir;
      }
    }, 1000);
  </script>
</body>
</html>
